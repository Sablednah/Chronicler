# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# What we BUILD against (one exact build) vs what the jar RUNS on (a range).
# Keep the distinction: a range pinned to the build strands users on an
# earlier patch for no reason. See CLAUDE.md "Versions".
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.42
# Any build in the 21.11 series, which is the series that targets MC 1.21.11.
neo_version_range=[21.11,21.12)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

# Dev server port. One pair per project in the family so two dev servers
# never fight over 25565 -- see the port table in CLAUDE.md. RCON is 25580
# and lives in run/server.properties (gitignored), so a fresh checkout sets
# it by hand.
dev_server_port=25570

## Mod Properties
mod_id=chronicler
mod_name=Chronicler
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.sablednah.chronicler
mod_authors=Sablednah
mod_description=Data-driven quests, chapters and storylines. Server-authoritative; vanilla clients play the whole thing. Built for LegendQuest, ZombieMod, CityWorld and SableCraft Standards, needs none of them.
