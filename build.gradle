plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against, on EVERY branch:
// chronicler-0.1.0+mc1.21.11.jar. All version branches share a mod_version, so
// three files called chronicler-0.1.0.jar would be indistinguishable in a mods
// folder. The version INSIDE neoforge.mods.toml stays plain.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

// A Windows-side client build (TestClient.cmd) gets its own build directory so
// it never tries to replace artifacts the WSL dev server holds open. Standards
// learned this one: a shared build/ fails with "Unable to delete file".
if (project.hasProperty('winClient')) {
    layout.buildDirectory = layout.projectDirectory.dir("build-win-${project.winClient}")
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to 1.21.x players. The 26.x branches say 25 here.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second pair of hands: TestBuddy auto-joins the dev server, no
        // second account needed (the dev server is online-mode=false).
        clientBuddy {
            client()
            programArguments.addAll '--username', 'TestBuddy',
                    '--quickPlayMultiplayer', "127.0.0.1:${project.dev_server_port}".toString()
            // Own game dir: sharing run/ with a live dev server means both
            // fight over logs/latest.log on drvfs.
            gameDirectory = file('runBuddy')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Capped: five sibling dev servers and their Gradle daemons share one
            // box, and an uncapped JVM reserves a quarter of RAM it never needs.
            jvmArgument '-Xmx2G'
            programArgument '--nogui'
            programArguments.addAll '--port', project.dev_server_port
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // -Pselftest -> runs neoforge/SelfTest on ServerStartedEvent. A -D on
            // the gradlew line lands on GRADLE's JVM, not the forked server, so
            // it has to be translated here.
            systemProperty 'chronicler.selftest', project.hasProperty('selftest') ? 'true' : 'false'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The most recently built <prefix>*.jar for THIS Minecraft line in a sibling's
// build/libs, or nothing. Newest by modification time, because version strings
// do not sort (1.10 < 1.9 as text) and a rebuilt jar keeps its old name.
// Falls back to ./libs (gitignored) for a sibling whose build/libs has no jar
// for this line -- ZombieMod builds 1.21.11 elsewhere; copy the instance's jar in.
def newestJar(String dir, String prefix) {
    def tag = "+mc${minecraft_version}.jar"
    for (String candidate : [dir, 'libs']) {
        def d = file(candidate)
        if (!d.isDirectory()) continue
        def jars = d.listFiles().findAll { it.name.startsWith(prefix) && it.name.endsWith(tag) && !it.name.contains('-sources') }
        if (!jars.isEmpty()) return [jars.max { it.lastModified() }]
    }
    return []
}

dependencies {
    // SnakeYAML powers the YAML front door (config/chronicler/**/*.yml served
    // as a datapack). Embedded jar-in-jar because Minecraft does not ship it.
    implementation 'org.yaml:snakeyaml:2.2'
    jarJar('org.yaml:snakeyaml') {
        version {
            strictly '[2.2,3.0)'
            prefer '2.2'
        }
    }

    // SOFT dependencies: compileOnly, never jarJar'd. Chronicler builds against
    // their APIs and must run with none of them present. Only the guarded
    // classes under neoforge/compat may import them (see CLAUDE.md).
    //
    // The NEWEST built jar of each, not a fileTree of all of them: a tree puts
    // every version on the classpath and javac takes whichever sorts first,
    // which is the oldest -- so a method added last week "does not exist" while
    // the jar that has it sits right beside it. An absent sibling leaves its
    // API off the classpath rather than failing configuration.
    compileOnly files(newestJar('../SableCraft-Standards/build/libs', 'standards-'))
    compileOnly files(newestJar('../LegendQuest-ReForged/build/libs', 'legendquest-'))
    compileOnly files(newestJar('../ZombieMod/ZombieMod/build/libs', 'zombiemod-'))
    compileOnly files(newestJar('../CityWorld-ReForged/build/libs', 'cityworld-'))
}

// Expand mod metadata properties into the generated neoforge.mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
