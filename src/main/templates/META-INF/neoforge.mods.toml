# Chronicler — neoforge.mods.toml (values are expanded from gradle.properties at build time).
# EDIT THIS TEMPLATE, never the generated copy under build/.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/Chronicler/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="https://sablecraft.co.uk/chronicler/"
# Mod-list artwork, declared three ways because 26.2 reshaped the list and
# older loaders ignore keys they do not know (LegendQuest worked this out):
#   iconFile   - small SQUARE beside the name (26.2+)
#   bannerFile - wide info-panel image (26.2+)
#   logoFile   - what 1.21.x and 26.1 show; 26.2's fallback
# No artwork yet -- add the files to src/main/resources and uncomment.
#iconFile="chronicler-icon.png"
#bannerFile="chronicler.png"
#logoFile="chronicler.png"

# The mod is server-authoritative: vanilla clients can join and play. A future
# optional client entrypoint may add a quest tracker HUD for modded clients.

# The NeoForge SERIES this was built for, not the exact build -- a NeoForge
# series tracks one Minecraft version, so the series is the honest unit.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Everything below is OPTIONAL. Chronicler must start, load content and run
# quests with none of them installed. Ordering AFTER so their registries and
# APIs exist by the time ours look for them. Version floors are set when a
# seam is first consumed, not before -- an unconsumed floor is a lie.
[[dependencies.${mod_id}]]
    modId="legendquest"
    type="optional"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="standards"
    type="optional"
    versionRange="[1.4.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="zombiemod"
    type="optional"
    versionRange="[3.4.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cityworld"
    type="optional"
    versionRange="[5.0.0,)"
    ordering="AFTER"
    side="BOTH"
